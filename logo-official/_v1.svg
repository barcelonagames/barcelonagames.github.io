         C 520 650, 504 650, 486 640 Z" fill="#EC2A28"/>

<!-- ===== BARCELONA GAMES curved ===== -->
<text font-size="60" fill="#EC2A28" letter-spacing="8" font-weight="bold">
  <textPath href="#arc" startOffset="50%" text-anchor="middle">BARCELONA GAMES</textPath>
</text>

<!-- ===== IG HANDLE bottom-right ===== -->
<text x="1004" y="1006" text-anchor="end" font-family="Lato, sans-serif" font-size="30" fill="#D2211F" font-weight="bold">@social.sports.games</text>
</svg>