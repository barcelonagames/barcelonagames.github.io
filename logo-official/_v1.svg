<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<defs>
  <style>
    @font-face { font-family:'Archivo Black'; src:url('/tmp/ArchivoBlack.ttf'); }
    text { font-family:'Archivo Black','Lato',sans-serif; }
  </style>
  <path id="arc" d="M 250 792 Q 512 900 774 792"/>
</defs>

<!-- ===== BANNER / HEADBAND ===== -->
<!-- back sliver (fold shadow) -->
