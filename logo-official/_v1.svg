         C 704 240, 846 268, 846 360
         L 846 468
         C 846 556, 700 585, 512 585
         C 324 585, 178 556, 178 468 Z" fill="#EC2A28"/>

<!-- BG letters -->
<text x="512" y="470" text-anchor="middle" font-size="300" fill="#FFFFFF" letter-spacing="6">BG</text>

<!-- ===== BANDANA KNOT + TAILS ===== -->
<!-- knot -->
<rect x="470" y="565" width="84" height="78" rx="26" fill="#EC2A28"/>
<!-- left tail -->
<path d="M 500 620 C 470 700, 430 740, 388 770 C 372 782, 372 760, 386 720
         C 405 668, 452 632, 500 625 Z" fill="#EC2A28"/>
<!-- right tail -->
<path d="M 524 620 C 554 700, 594 740, 636 770 C 652 782, 652 760, 638 720
         C 619 668, 572 632, 524 625 Z" fill="#EC2A28"/>
<!-- center tail -->
